name: Build and test

on:
  push:
  pull_request:

# Stop spending runner time on commits superseded by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev xvfb libxtst6 libglib2.0-bin desktop-file-utils shellcheck
      - name: Linux installer checks
        if: runner.os == 'Linux'
        run: shellcheck scripts/install-linux.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Headless document information
        run: python3 scripts/smoke-info.py target/release/pagewing
      - name: Exercise renderer and text extraction
        shell: bash
        run: |
          target/release/pagewing --render assets/pagewing-guide.pdf target/guide.png 1 1200
          target/release/pagewing --text assets/pagewing-guide.pdf 1
          target/release/pagewing --benchmark assets/pagewing-guide.pdf 2
      - name: Bundle macOS application
        if: runner.os == 'macOS'
        run: bash scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pagewing-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/pagewing
            target/Pagewing.app
            target/guide.png

  desktop-smoke:
    name: Desktop smoke (${{ matrix.shard }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Balanced using measured test durations; each group takes about 5 minutes.
        # Each job owns its X server, so keyboard, mouse and clipboard stay isolated.
        include:
          - shard: 1
            tests: >-
              vim-view fit-height paths close properties cli load-cancel
          - shard: 2
            tests: >-
              search-options percentage bookmarks link-copy link-hints
              search-dense outline-keyboard search-load help comments
          - shard: 3
            tests: >-
              input-burst relative outline mouse-history link-menu continuous
              recent password zoom persistence install-linux
          - shard: 4
            tests: >-
              desktop destinations thumbnails selection selection-scroll
              page-size long-title file-watch mouse-input
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libgl1 libx11-6 libxi6 libxrandr2 xvfb libxtst6 libglib2.0-bin desktop-file-utils
      - uses: actions/download-artifact@v4
        with:
          name: pagewing-Linux-X64
          path: target
      - name: Native desktop smoke tests
        env:
          SMOKE_TESTS: ${{ matrix.tests }}
        run: |
          chmod +x target/release/pagewing
          failed=0
          for test in $SMOKE_TESTS; do
            echo "::group::smoke-$test"
            if ! xvfb-run -a -s '-screen 0 1280x1024x24' python3 "scripts/smoke-$test.py" target/release/pagewing; then
              echo "::error::smoke-$test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
