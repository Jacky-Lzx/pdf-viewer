api_version = 2
name = "Focus reader · j/k"
enabled = false
command = ["python3", "-u", "plugin.py", "--lines", "3"]
timeout_seconds = 5

description = "Keep a few lines bright while dimming the rest. Move with j/k or arrows; Esc exits."
version = "1.0.0"
author = "Pagewing"

[[settings]]
key = "lines"
label = "Visible lines"
type = "integer"
default = 3
min = 1
max = 20

[[settings]]
key = "opacity"
label = "Dim strength"
type = "number"
default = 0.72
min = 0.0
max = 1.0
