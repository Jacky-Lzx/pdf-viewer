#:schema ./config.schema.json
# Pagewing: ~/.config/pagewing/config.toml (or $XDG_CONFIG_HOME/pagewing/config.toml).
# Edit and restart the reader. Missing options use built-in defaults.

[appearance]
dark = false
night = false
sidebar = false
thumbnails = false
# Display-only outline text weight, 0.0–1.0. Try 0.2 for thin serif fonts.
text_embolden = 0.0
# Amount added/removed by the text weight shortcuts (range: 0.001–1.0).
text_embolden_step = 0.05

# Output colors for black (foreground) and white (background) source pixels.
[appearance.white]
foreground = "#000000"
background = "#ffffff"
# canvas = "#ebefeb" # Outside the paper; omitted: follow the interface theme.

[appearance.inverted]
foreground = "#ffffff"
background = "#000000"
# Catppuccin Mocha: foreground = "#cdd6f4", background = "#1e1e2e"
# canvas = "#181825"

[display]
# single, continuous, facing
layout = "single"
# page, width, height, or a zoom factor: 1.5 = 150% (range: 0.05-8.0)
fit = "page"
# Restore saved document views; false opens at page 1 with the defaults above.
remember_documents = true

[shortcuts]
text_embolden_increase = ["Alt+Equals"]
text_embolden_decrease = ["Alt+Minus"]
# An action replaces all of its default bindings; [] disables it.
# Modifiers: Cmd (Ctrl on Linux, Command on macOS), Ctrl, Alt, Shift.
# Use key names such as X, ArrowDown, PageDown, Comma, Plus, Questionmark.
# next_page = ["X", "Shift+J"]
# next_chapter = ["Alt+ArrowDown"] # Previous: previous_chapter = ["Alt+ArrowUp"].
# zoom = ["Cmd+Alt+Z"] # Open the exact zoom percentage input.
# night = []
