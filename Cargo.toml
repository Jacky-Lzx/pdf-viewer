[package]
name = "pagewing"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A fast, keyboard-driven PDF reader for Linux and macOS"
license = "MIT"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
hayro = "0.8.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
png = "0.18"
ttf-parser = "0.25"
caseless = "0.2.2"
unicode-segmentation = "1.13.3"
bytemuck = "1.25.2"
memchr = "2.8.3"
lopdf = { version = "0.45.0", default-features = false }
tempfile = "3"
shlex = "2.0.1"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.hayro]
opt-level = 2

[profile.dev.package.vello_cpu]
opt-level = 2

[[bin]]
name = "pagewing"
path = "src/main.rs"

[[bench]]
name = "rotation"
harness = false

[[bench]]
name = "link_hints"
harness = false

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "word_selection"
harness = false

[[bench]]
name = "sparse_selection"
harness = false

[[bench]]
name = "search_index"
harness = false

[[bench]]
name = "search_snippet"
harness = false

[[bench]]
name = "pdf_strings"
harness = false

[[bench]]
name = "pdf_string_prefix"
harness = false

[[bench]]
name = "texture_pixels"
harness = false

[[bench]]
name = "search_matching"
harness = false

[[bench]]
name = "link_visibility"
harness = false

[[bench]]
name = "document_bytes"
harness = false

[[bench]]
name = "outline_filter"
harness = false

[[bench]]
name = "link_reading"
harness = false

[[bench]]
name = "text_cache"
harness = false

[[bench]]
name = "texture_cache"
harness = false

[[bench]]
name = "metadata_trees"
harness = false
